name: USBRIN Commercial Catalog - Review Only

on:
  push:
    branches:
      - feature/usbrin-catalogo-comercial-revisao-20261119

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check commercial values and Studio calculations
        run: npm run test:pricing
      - name: Build website without publishing
        run: npm run build
      - name: Verify site, Studio and public prices remain present
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/studio.html
          test -f dist/js/studio-pricing.js
          grep -q 'id="planos-usbrin"' dist/index.html
          grep -q 'id="studio-form"' dist/studio.html
          grep -q 'Site Business' dist/index.html
