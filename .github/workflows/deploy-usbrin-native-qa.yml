name: Deploy USBRIN ID Native QA (isolated)

on:
  push:
    branches:
      - feature/usbrin-id-login-proprio-20261118
    paths:
      - 'ops/native-qa-deploy-request.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usbrin-native-qa-deploy
  cancel-in-progress: false

jobs:
  qa-deploy:
    if: github.repository == 'usbrin/usbrin-site' && github.ref == 'refs/heads/feature/usbrin-id-login-proprio-20261118'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit under review
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify native auth routes and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in functions/_middleware.js functions/_lib/auth.js \
            functions/_lib/native-auth.js functions/_lib/native-password.js \
            functions/api/native/login.js functions/api/native/logout.js \
            functions/api/native/password/request.js \
            functions/api/native/password/confirm.js \
            'functions/api/private/[[path]].js' \
            js/login.js js/senha.js js/portal.js js/usbrin-id.js; do
            node --check "$file"
          done
          node --test tests/native-auth.test.mjs
          node --test tests/partners-api.test.mjs
          node --test tests/studio-pricing.test.cjs

      - name: Build static assets using the project allowlist
        run: npm run build

      - name: Enforce private page isolation and function routing
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/login.html
          test -f dist/senha.html
          test -f dist/portal.html
          test -f dist/_routes.json
          test -f functions/_middleware.js
          test ! -e dist/functions
          test ! -e dist/public/portal.html
          test ! -e dist/public/js/portal.js
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('dist/_routes.json'));for(const p of ['/portal','/portal.html','/proposta.html','/js/portal.js','/api/*'])if(!r.include.includes(p))throw Error(p+' missing');if(r.exclude.length)throw Error('Unexpected exclusion');"

      - name: Deploy only to isolated native QA Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '25eaef72c8dbc252be724778072cb0e4'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx --yes wrangler@4.163.0 pages deploy ./dist \
            --project-name=usbrin-id-native-qa \
            --branch=native-qa
