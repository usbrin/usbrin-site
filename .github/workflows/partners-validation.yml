name: USBRIN Partners — Validation
on:
  push:
    branches:
      - feature/usbrin-partners-platform
  pull_request:
    branches:
      - feature/usbrin-studio-mvp
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check js/candidatura.js
          node --check js/portal.js
          node --check functions/_lib/billing.js
          node --check functions/_lib/bank-csv.js
          node --check functions/_lib/bank-reconcile.js
          node --check functions/_lib/finance-control.js
          node --check js/proposta.js
          node --check js/studio.js
          node --check functions/api/studio-inquiry.js
          node --check js/status-candidatura.js
          node --check functions/api/application-status.js
          node --check functions/public/api/public-config.js
          node --check functions/public/api/applications.js
          node --check functions/public/api/application-status.js
          node --check functions/_lib/security.js
          node --check functions/_lib/auth.js
          node --check functions/api/public-config.js
          node --check functions/api/applications.js
          node --check 'functions/api/private/[[path]].js'
      - name: Check D1 schema in isolated SQLite memory database
        run: |
          python3 - <<'PY'
          import sqlite3
          c=sqlite3.connect(':memory:')
          for migration in ['0001_partners.sql','0002_financial_integrity.sql','0003_partner_contracts.sql','0004_studio_inquiries.sql','0005_studio_assignments.sql','0006_sale_project_links.sql','0007_atomic_receipts.sql','0008_crm_followups.sql','0009_proposal_drafts.sql','0010_project_proposal_handoff.sql','0011_optional_services.sql','0012_recurring_billing_controls.sql','0013_bank_evidence_and_refunds.sql','0014_expense_obligations.sql','0015_fiscal_evidence.sql']:
              c.executescript(open('migrations/'+migration).read())
          expected=['users','applications','opportunities','sales','commissions','goals','projects','developer_payments','audit_events']
          for name in expected:
              assert c.execute("select name from sqlite_master where name=?",(name,)).fetchone(),name
          print('Schema OK: '+', '.join(expected))
          PY
      - name: Partners API access and ledger integration tests
        run: node --test tests/partners-api.test.mjs
      - name: Existing Studio price rules
        run: node --test tests/studio-pricing.test.cjs
      - name: Build static assets
        run: npm run build
      - name: Verify new pages are included and preserved
        run: |
          test -f dist/index.html
          test -f dist/studio.html
          test -f dist/privacidade-studio.html
          test -f dist/parceiros.html
          test -f dist/candidatura.html
          test -f dist/status-candidatura.html
          test -f dist/portal.html
          test -f dist/proposta.html
          test -f dist/js/proposta.js
          test -f dist/css/proposta.css
          test ! -e dist/public/proposta.html
          test -f dist/privacidade-parceiros.html
          test -f dist/public/index.html
          test -f dist/public/parceiros.html
          test -f dist/public/candidatura.html
          test -f dist/public/status-candidatura.html
          test -f dist/public/privacidade-parceiros.html
          test -f dist/public/css/parceiros.css
          test -f dist/public/js/candidatura.js
          test ! -e dist/public/portal.html
          test ! -e dist/public/js/portal.js
          test ! -e dist/public/api/private
          grep -q 'href="/portal.html"' dist/public/parceiros.html
          test -f dist/css/parceiros.css
          test -f dist/js/portal.js
          grep -q 'id="studio-form"' dist/studio.html
          grep -q 'id="studio-direct-inquiry"' dist/studio.html
          grep -q 'id="view-studio"' dist/portal.html
          grep -q 'href="studio.html"' dist/index.html
          grep -q 'parceiros.html' dist/index.html
          echo 'Static build checks passed'
