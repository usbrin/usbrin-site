name: USBRIN ID ZITADEL QA - HTTP Smoke

on:
  push:
    branches:
      - feature/usbrin-id-zitadel-custom-ui-20261119
    paths:
      - 'ops/zitadel-qa-smoke-request.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-qa:
    if: github.repository == 'usbrin/usbrin-site' && github.ref == 'refs/heads/feature/usbrin-id-zitadel-custom-ui-20261119'
    runs-on: ubuntu-latest
    steps:
      - name: Verify isolated QA screens and protections anonymously
        shell: bash
        run: |
          set -euo pipefail
          base="https://usbrin-id-native-qa.pages.dev"
          test_status(){
            local path="$1" expected="$2" got
            got=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' --max-redirs 0 "$base$path")
            echo "$path => HTTP $got"
            test "$got" = "$expected"
          }
          test_status "/login" 200
          test_status "/portal" 302
          test_status "/js/portal.js" 401
          test_status "/api/private/me" 401
          config="$(curl -sS --max-time 20 "$base/api/native/config")"
          node -e "const o=JSON.parse(process.argv[1]);if(!o.ok||o.mode!=='zitadel'||o.passwordRecovery!==false)throw Error('ZITADEL QA mode not live');" "$config"
          echo "QA exposes only nonsensitive ZITADEL mode metadata"

      - name: Check public ZITADEL discovery from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --retry 2 --max-time 15 -sS -o /dev/null -w '%{http_code} %{remote_ip}' \
            'https://usbrin-id-rzf8mn.us1.zitadel.cloud/.well-known/openid-configuration')" || true
          echo "GitHub runner public OIDC discovery (HTTP and remote IP only): $result"

      - name: Inspect sanitized ZITADEL QA upstream status (no token, no identities)
        shell: bash
        run: |
          set -euo pipefail
          base="https://usbrin-id-native-qa.pages.dev"
          status="$(curl --max-time 20 -sS -X POST "$base/api/qa/provider-status" \
            -H 'origin: https://usbrin-id-native-qa.pages.dev' -H 'accept: application/json')"
          node -e "const x=JSON.parse(process.argv[1]);if(!x.qa)throw Error('Missing QA output');console.log('ZITADEL Session API:',x.providerStatus,'/ public OIDC metadata:',x.publicMetadata)" "$status"

      - name: Verify ZITADEL service integration rejects nonexistent synthetic identity
        shell: bash
        run: |
          set -euo pipefail
          url="https://usbrin-id-native-qa.pages.dev/api/native/login"
          body='{"email":"qa-zitadel-probe@invalid.example","password":"synthetic-test-password-never-used"}'
          metrics="$(curl --max-time 25 -sS -o /dev/null -w '%{http_code} %{time_total}' -X POST "$url" \
            -H 'content-type: application/json' \
            -H 'origin: https://usbrin-id-native-qa.pages.dev' \
            --data-binary "$body")"
          status="${metrics%% *}"
          elapsed="${metrics#* }"
          echo "Nonexistent ZITADEL identity => HTTP $status, request elapsed ${elapsed}s"
          if [ "$status" != 401 ]; then
            echo "::error::Expected invalid credentials (401); cannot confirm ZITADEL service integration. No real identity was used."
            exit 1
          fi
          echo "Synthetic identity was rejected. A real approved identity is still needed for end-to-end login homologation."
